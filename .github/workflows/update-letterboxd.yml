name: Update Letterboxd feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # una vez al día

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RSS feed
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -A "Mozilla/5.0 (carmoran0.github.io feed sync)" \
            https://letterboxd.com/klamstrakur0/rss/ -o /tmp/letterboxd.xml
          # Solo reemplazar si el feed es válido (evita guardar páginas de error)
          grep -q "<item>" /tmp/letterboxd.xml
          mv /tmp/letterboxd.xml data/letterboxd.xml

      # git a mano en vez de una Action de terceros con permiso para empujar a main
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/letterboxd.xml
          git diff --cached --quiet || { git commit -m 'chore: actualizar feed de Letterboxd (autogenerado)' && git push origin HEAD; }
