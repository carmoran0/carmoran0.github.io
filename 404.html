<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3; url=/">
<title>404 · CarlOS</title>
<link rel="icon" type="image/gif" href="/assets/favicon.gif">
<style>
:root{--ink:#1a1a1a;--paper:#fbfaf7;--bg:#f3f1ec;--muted:#5d5b55;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#ebe9e3;--paper:#171615;--bg:#0d0c0b;--muted:#a6a39a;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace}
main{width:100%;max-width:420px;padding:24px 20px;background:var(--paper);border:1px solid var(--ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Georgia,serif;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.03em;text-transform:none;color:var(--ink);margin-bottom:16px}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Esta página no existe. Volviendo a <a href="/">la portada</a>…</p>
</main>
</body>
</html>
