<link rel="preload" href="/assets/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{font-family:'Instrument Serif';font-display:swap;src:url(/assets/fonts/instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-display:swap;src:url(/assets/fonts/instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-display:swap;src:url(/assets/fonts/ibm-plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-500.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-weight:400 900;font-display:swap;src:url(/assets/fonts/schibsted-grotesk.woff2) format('woff2')}
:root{--ink:#1a1a1a;--paper:#fbfaf7;--bg:#f3f1ec;--sep:#e1ded6;--dot:#c9c6bd;--muted:#5d5b55;--accent:#b0412e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#ebe9e3;--paper:#171615;--bg:#0d0c0b;--sep:#2d2b28;--dot:#3b3935;--muted:#a6a39a;--accent:#e57a63;color-scheme:dark}}
:root[data-theme=dark]{--ink:#ebe9e3;--paper:#171615;--bg:#0d0c0b;--sep:#2d2b28;--dot:#3b3935;--muted:#a6a39a;--accent:#e57a63;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Schibsted Grotesk',Helvetica,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--dot);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent);color:var(--accent)}
button{font:inherit;color:inherit}
.plain{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html:not(.js) .js-only{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.caps{font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.pad{padding-left:clamp(16px,2vw,20px);padding-right:clamp(16px,2vw,20px)}
.serif{font-family:'Instrument Serif',serif}
@keyframes shelfIn{0%{transform:translateY(-90px) rotate(-6deg);opacity:0}55%{opacity:1}75%{transform:translateY(4px) rotate(1deg)}100%{transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes cardIn{from{transform:translateY(14px);opacity:0}}

.wrap{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:clamp(16px,5vw,64px) clamp(12px,4vw,56px)}
.card{width:100%;max-width:1120px;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:11px}
#theme{display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
#theme:hover{background:var(--ink);color:var(--paper)}

.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;padding-top:clamp(22px,3vw,28px);padding-bottom:clamp(18px,2.4vw,22px);border-bottom:1px solid var(--ink)}
.head>div:first-child{display:flex;flex-direction:column;gap:10px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(52px,8vw,96px);line-height:.85;letter-spacing:-.03em}
.head p{font-size:15px;color:var(--muted);max-width:52ch;text-wrap:pretty}
.stats{display:flex;gap:clamp(18px,3vw,32px);font-family:'IBM Plex Mono',monospace}
.stats div{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stats b{font-size:clamp(22px,2.6vw,30px);font-weight:500;line-height:1}
.stats span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.ctl{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:11px}
.sorts{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.sorts>span{color:var(--muted);padding-right:6px}
.sorts button{padding:2px 8px;border:1px solid var(--ink);background:transparent;color:var(--ink);letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.sorts button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#reading{display:flex;align-items:center;gap:6px;padding:0;border:0;background:transparent;color:var(--accent);letter-spacing:inherit;text-transform:inherit;cursor:pointer}
#reading[hidden]{visibility:hidden}
#reading span{font-family:'Instrument Serif',serif;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink)}

.mueble{padding:clamp(16px,3vw,32px) clamp(12px,3vw,32px) clamp(20px,3vw,32px)}
.marco{border:1px solid var(--ink);background:var(--paper);padding:12px 10px 0}
#fondo{min-height:248px;border:1px solid var(--ink);border-bottom:0;background:var(--bg)}
.zocalo{height:16px;margin:0 -10px;border-top:1px solid var(--ink)}
.balda{display:flex;flex-direction:column;animation:fadeIn .4s ease}
.hueco{position:relative;display:flex;align-items:flex-end;gap:2px;height:236px;padding:0 14px;overflow:hidden}
.tablero{position:relative;height:12px;margin:0 -1px;background:var(--paper);border:1px solid var(--ink)}
.sujeta{flex-shrink:0;width:22px;height:66px;margin-left:3px;border-left:6px solid var(--ink);border-bottom:6px solid var(--ink)}
.vacia{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;color:var(--muted)}

.lomo{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border:1px solid var(--ink);border-bottom:0;box-shadow:inset 3px 0 0 rgba(255,255,255,.1),inset -4px 0 0 rgba(0,0,0,.14)}
button.lomo{cursor:pointer;transition:transform .18s ease,margin .3s cubic-bezier(.2,.8,.3,1.2)}
button.lomo:hover{transform:translateY(-7px)}
.lomo.solo{border-bottom:1px solid var(--ink)}
.fil{width:100%;height:5px;flex-shrink:0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.5}
.lt,.la{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden}
.lt{flex:1;min-height:0;font-family:'Instrument Serif',serif;line-height:1;text-overflow:ellipsis}
.la{flex-shrink:0;max-height:64px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.cinta{position:absolute;top:-1px;right:5px;width:7px;height:34px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
button.lomo.sel{margin-bottom:18px}
.placa{flex-shrink:0;width:2px;height:128px;margin:0 5px;background:var(--dot);animation:fadeIn .4s ease}
.canto{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 4px;border-left:1px solid var(--muted);font-size:9px;line-height:1;color:var(--muted);white-space:nowrap}
.pila{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;margin-bottom:-1px}
.pila-tag{margin:0 0 7px 8px;padding:3px 6px 2px;border:1px solid var(--ink);background:var(--paper);font-size:9px;line-height:1.2;white-space:nowrap;transform:rotate(-3deg);animation:fadeIn .4s ease}
.tumbado{flex-shrink:0;display:flex;align-items:center;gap:7px;margin-top:-1px;margin-left:var(--off,0px);padding:0 0 0 8px;border:1px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.1),inset 0 -4px 0 rgba(0,0,0,.14);cursor:pointer;transition:transform .18s ease,margin .3s cubic-bezier(.2,.8,.3,1.2)}
.tumbado:hover{transform:translateX(7px)}
.tumbado.sel{margin-left:calc(var(--off,0px) + 14px)}
.ta{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tt{flex:1;min-width:0;font-family:'Instrument Serif',serif;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tf{flex-shrink:0;width:5px;height:100%;margin-right:9px;border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:.5}

.foot{display:flex;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;border-top:1px solid var(--ink);font-size:12px;color:var(--muted)}
.nojs{padding:20px clamp(16px,2vw,20px);font-size:15px;color:var(--muted)}

#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,10,.5);animation:fadeIn .15s ease}
.dlg{width:100%;max-width:840px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink);animation:cardIn .22s ease}
.dbar{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px clamp(14px,2vw,18px);background:var(--paper);border-bottom:1px solid var(--ink);font-size:11px}
.dbar>span{color:var(--accent)}
.dbar div{display:flex;gap:4px}
.dbar button{width:28px;height:24px;border:1px solid var(--ink);background:transparent;cursor:pointer}
.dbar button:hover{background:var(--ink);color:var(--paper)}
.dbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.dl{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:clamp(24px,4vw,40px) 20px 20px;background:var(--bg);border-bottom:1px solid var(--sep)}
.dl>div{display:flex;align-items:flex-end;gap:10px}
.dl>span{font-size:10px;color:var(--muted)}
.portada{border:1px solid var(--ink);background:var(--sep);object-fit:cover;display:block}
.portada-ph{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px 12px;border:1px solid var(--ink);overflow:hidden}
.portada-ph b{font-family:'Instrument Serif',serif;font-weight:400;font-size:22px;line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.portada-ph small{font-size:9px;opacity:.85}
.dr{display:flex;flex-direction:column;gap:18px;padding:clamp(20px,3vw,28px)}
.dr header{display:flex;flex-direction:column;gap:6px}
.dr .now{font-size:10px;color:var(--accent)}
.dr .todo{font-size:10px;color:var(--muted)}
.dr h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.dr header>span:last-child{font-size:16px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px}
.stars{display:flex;gap:2px;font-size:24px;line-height:1}
.star{position:relative;display:inline-block;color:var(--dot)}
.star span{position:absolute;left:0;top:0;overflow:hidden;color:var(--accent)}
.rate>span:last-child{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--sep)}
.meta div{display:flex;flex-direction:column;gap:3px;padding:10px 0}
.meta small{font-size:10px;color:var(--muted)}
.meta b{font-family:'Instrument Serif',serif;font-weight:400;font-size:24px;line-height:1}
.review{font-size:16px;line-height:1.55;white-space:pre-wrap;text-wrap:pretty}
.acc{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:11px}
.acc button{padding:0;border:0;background:transparent;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-decoration-color:var(--dot);text-underline-offset:3px;cursor:pointer}
.acc button:hover{color:var(--accent);text-decoration-color:var(--accent)}

/* Transiciones entre páginas: el marco se queda y el título viaja */
@view-transition{navigation:auto}
.card{view-transition-name:card}
h1{view-transition-name:title}
::view-transition-group(*){animation-duration:.38s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
::view-transition-image-pair(card){overflow:clip}
::view-transition-old(card),::view-transition-new(card){height:auto;object-fit:none;object-position:top}
::view-transition-old(title),::view-transition-new(title){width:auto;height:100%}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="bar pad caps">
      <a class="plain" href="/">← CarlOS</a>
      <button id="theme" class="js-only" aria-label="Cambiar modo claro/oscuro" title="Cambiar modo claro/oscuro">◐ <span id="theme-label">Oscuro</span></button>
    </div>

    <header class="head pad">
      <div>
        <h1>Estante<em>ría</em></h1>
        <p>Libros que he leído. Pincha en un lomo para sacarlo.</p>
      </div>
      <div class="stats js-only" id="stats"><div><b>–</b><span>leídos</span></div><div><b>–</b><span>páginas</span></div><div><b>–</b><span>nota media</span></div></div>
    </header>

    <noscript><p class="nojs">La estantería necesita JavaScript. La lista está en <a href="/estanteria/libros.json">libros.json</a>.</p></noscript>

    <div class="ctl pad caps js-only">
      <div class="sorts" id="sorts"><span>Ordenar</span><button type="button" data-k="fecha" aria-pressed="true">Fecha</button><button type="button" data-k="autor" aria-pressed="false">Autor</button><button type="button" data-k="tamano" aria-pressed="false">Tamaño</button><button type="button" data-k="nota" aria-pressed="false">Nota</button><button type="button" data-k="color" aria-pressed="false">Color</button></div>
      <button id="reading" type="button" hidden>● Leyendo ahora: <span>&nbsp;</span></button>
    </div>

    <div class="mueble js-only">
      <div class="marco">
        <div id="fondo"></div>
        <div class="zocalo" aria-hidden="true"></div>
      </div>
    </div>

    <footer class="foot pad caps">
      <a class="plain" href="/">← Volver</a>
      <span>Datos y portadas: <a href="https://openlibrary.org/" target="_blank" rel="noopener">Open Library</a></span>
    </footer>
  </main>
</div>
</body>
</html>
