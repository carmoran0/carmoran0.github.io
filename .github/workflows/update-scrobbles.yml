name: Update Last.fm scrobbles

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # justo después de medianoche en Madrid: el día anterior ya está completo

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node ya viene en ubuntu-latest; el script solo necesita fetch (Node >= 18)
      - name: Test day boundaries
        run: node --test developer/update-scrobbles.test.js

      - name: Count scrobbles per day
        run: node developer/update-scrobbles.js

      # git a mano en vez de una Action de terceros con permiso para empujar a main
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scrobbles.json
          git diff --cached --quiet || { git commit -m 'chore: actualizar escuchas de Last.fm (autogenerado)' && git push origin HEAD; }
